name = "truyen-ai-v12-21-background"
main = "index.cjs"
compatibility_date = "2026-10-02"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "BG_JOBS"
id = "ed95b4613f8b41d5a5eae3453425afa2"

[[queues.consumers]]
queue = "truyen-ai-background"
batch_size = 1
max_batch_timeout = 5
max_concurrency = 1
max_retries = 3
max_wait_time = 10

[vars]
APP_URL = "https://truyen-ai.pages.dev"
EXTRACT_CONCURRENCY = "3"
